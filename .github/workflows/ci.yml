name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only the repo-specific jobs at the bottom of this file read these. A called
# workflow does not inherit caller-level `env:`; the reusable workflow declares
# its own copy of exactly the same three.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@9234e1fa9f85b14a8d6fddc7a8f7378f7e30b183
    with:
      # The old `test` job ran on ubuntu-latest only. `true` would newly gate on
      # macOS and Windows, which nothing here has ever been shown to pass.
      os-matrix: false
      # The old MSRV job ran `cargo test --workspace` on 1.85, not a bare build.
      # The floor needs no input: both members declare rust-version "1.85", so
      # the workflow derives the same 1.85 the job was pinned to.
      msrv-check: test
      # `all-features` stays at its default (true), which reproduces the old
      # coverage command exactly:
      #   cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      # The old clippy/test jobs ran BOTH the default-feature and the
      # --all-features leg; the shared workflow runs one. The default-feature
      # leg is preserved verbatim as the `default-features` job below.
      #
      # The repo's own deny.toml, not the shared fleet config. Local is strictly
      # STRICTER: `[bans] multiple-versions = "deny"` (shared: "warn") and
      # `[advisories] ignore = []` (shared: 21 RUSTSEC ignores). Adopting the
      # shared file would loosen this gate, which an adoption PR must not do.
      deny-config-repo: ""
      # cargo-deny-action defaults its `arguments` input to `--all-features`, so
      # the old job checked the full-feature dependency graph. Carry that across.
      deny-args: --all-features

  # ---------------------------------------------------------------------------
  # Repo-specific jobs, carried across from the pre-adoption ci.yml.
  # ---------------------------------------------------------------------------

  # The old clippy and test jobs each ran twice: once on default features and
  # once with --all-features. The shared workflow runs one feature set, and it
  # is the --all-features one (which the coverage gate also measures). This job
  # is the other leg, so the default-feature build keeps its gate.
  default-features:
    name: Clippy + Test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The e2e half of the old `coverage` job. The shared workflow's coverage gate
  # measures the whole suite; this second, independent gate asserts the
  # public-API (forensic/tests/) suite ALONE reaches every library line except a
  # documented allowlist. No input can express it, so it is copied verbatim —
  # only the surrounding job scaffolding (checkout/toolchain/install) is new,
  # and that is the same scaffolding the old coverage job used.
  coverage-e2e:
    name: Coverage (e2e public-API reachability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          cache-on-failure: true
      - run: cargo install cargo-llvm-cov --locked
      # The e2e suite (forensic/tests/, exercising only the public API) must
      # independently cover every library line reachable through
      # open()/extract()/audit(). A small, documented set of guards is
      # unreachable through the public API and is covered by the unit suite
      # instead; those are allowlisted below. File-aware (the report spans
      # core/src/lib.rs, forensic/src/lib.rs, forensic/src/findings.rs,
      # forensic/src/bodyfile.rs).
      - name: Enforce e2e (public-API) coverage
        run: |
          # This gate is scoped to the forensic reader/analyzer public API
          # (open()/extract()/audit(), exercised by forensic/tests/). The core
          # `vfs` adapter (core/src/vfs.rs, behind the `vfs` feature) is a
          # separate FileSystem-trait API this suite does not drive; its 100%
          # coverage is enforced by the total-coverage gate above via its own
          # unit suite, so exclude it here rather than mis-flag it as an
          # uncovered forensic-public-API line.
          cargo llvm-cov --workspace --all-features --ignore-filename-regex 'core/src/vfs\.rs' --test synthetic --test real_images --test canonical_finding_tests --lcov --output-path e2e.info
          awk -F: '/^SF:/{f=$2} /^DA:[0-9]+,0$/{split($0,a,","); split(a[1],b,":"); print f" "b[2]}' e2e.info > /tmp/e2e_uncovered.txt
          fail=0
          while read -r file ln; do
            txt=$(sed -n "${ln}p" "$file" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            case "$txt" in
              "}") ;;                                                            # bare brace — never real missed logic
              "r.seek(SeekFrom::Start(archive_origin))?;") ;;                    # >256 MiB tail-scan fallback
              "if let Some(result) = scan_window(r, label, use_label)? {") ;;    # >256 MiB tail-scan fallback
              "return Ok(result);") ;;                                           # >256 MiB tail-scan fallback
              "fn flush(&mut self) -> std::io::Result<()> {") ;;                 # CapWriter::flush — never called on the streaming path
              "self.inner.flush()") ;;                                           # CapWriter::flush body
              "break; // truncated slice: stop, do not spin") ;;                  # SliceReader truncated-slice guard - unit-tested
              'return Err(DarError::Corrupt("terminator underflows archive".into()));') ;; # all-0xFF file forbidden by magic
              'return Err(DarError::Corrupt("header flag field too large".into()));') ;; # read_header_flags guard — unit-tested
              "return Ok(0); // the flag field was introduced at edition 2") ;;   # read_compr_bs edition-1 path — unit-tested
              "read_infinint(r)?; // skip the initial offset") ;;                 # read_compr_bs initial-offset skip — unit-tested
              'other => Err(DarError::Corrupt(format!("unrecognised compression codec '"'"'{}'"'"'", other as char))),') ;; # decode_stream unrecognised-codec arm — unreachable via public API; unit-tested
              *) echo "::error::e2e leaves a public-API-reachable line uncovered: ${file}:${ln}: ${txt}"; fail=1 ;;
            esac
          done < /tmp/e2e_uncovered.txt
          [ "$fail" = 0 ] && echo "e2e suite covers all public-API-reachable lines ✓ (only documented unit-only guards remain)"
          exit $fail

  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          cache-on-failure: true
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true
