[package]
name        = "dar"
version     = "0.1.0"
edition     = "2021"
rust-version = "1.85"
description = "Pure-Rust DAR (Disk ARchiver) archive reader"
license     = "MIT"
repository  = "https://github.com/SecurityRonin/dar"
homepage    = "https://github.com/SecurityRonin/dar"
documentation = "https://docs.rs/dar"
authors     = ["Albert Hui"]
keywords    = ["forensics", "dar", "archive", "backup"]
