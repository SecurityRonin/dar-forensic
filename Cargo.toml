[workspace]
resolver = "2"
members = ["core", "forensic"]

# Single source of truth for fields shared by every member (DRY): edit MSRV /
# license / repo here once; members inherit via `field.workspace = true`. The
# per-crate `version` differs (core 0.7.0 vs forensic 0.7.1), so it stays inline.
[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
repository = "https://github.com/SecurityRonin/dar-forensic"
homepage = "https://github.com/SecurityRonin/dar-forensic"
authors = ["Albert Hui"]
keywords = ["forensics", "dar", "archive", "passware", "backup"]
categories = ["parser-implementations"]

[workspace.dependencies]
thiserror = "2"
# Shared forensic report model — Severity / Finding / Observation.
forensicnomicon = "0.3.1"
tempfile  = "3"
# Pure-Rust (miniz_oxide) zlib backend — dar's "gzip" is a raw zlib stream.
flate2    = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust bzip2 decoder (decompress-only); keeps unsafe_code = "forbid".
bzip2-rs  = "0.1"
# Pure-Rust zstd decoder (decompress-only); dar writes a standard zstd frame.
ruzstd    = "0.7"
# Pure-Rust xz/lzma decoder; keeps unsafe_code = "forbid".
lzma-rs   = "0.3"
# Pure-Rust lz4 decoder; dar's per-block lz4 entries are raw LZ4 blocks.
lz4_flex  = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
# Pure-Rust lzo decoder (decompress-only); dar's per-block lzo entries are raw
# lzo1x blocks. `default-features = false` drops the crate's `alloc` convenience —
# this reader only needs the `no_std` `decompress_into`. Keeps unsafe_code clean
# (the lzo crate is `#![forbid(unsafe_code)]`).
lzo       = { version = "0.1", default-features = false }
# Optional structured-output support for audit() findings (feature = "serde").
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Internal: the forensic analyzer depends on the parser core. Keyed `dar` so the
# import path is `use dar::…` while the published package is `dar-core`.
dar        = { version = "0.7.0", path = "core", package = "dar-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Paranoid: production parsers must never panic on crafted input. Tests opt out
# via `#![cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used))]`.
unwrap_used = { level = "deny", priority = 0 }
expect_used = { level = "deny", priority = 0 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
# Forensic doc comments carry file paths, version strings and shell commands;
# backticking every identifier is noise and clippy --fix mangles the examples.
doc_markdown = { level = "allow", priority = 1 }
